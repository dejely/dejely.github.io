    projects:
      - name: "[Manobela](https://manobela.dev)"
        highlights:
          - "Problem: Driver fatigue and distraction can be difficult to detect early, especially without expensive in-vehicle hardware."
          - "Solution: Built a real-time driver monitoring system using mobile camera input, facial landmark telemetry, and cloud-assisted processing."
          - "Architecture and screenshots: [project site](https://github.com/popcorn-prophets/manobela), [project article](https://dejel.me/projects/manobela/index.html), [monitor screenshot](https://dejel.me/projects/manobela/images/manobela-monitor-annotated.png), [insights screenshot](https://dejel.me/projects/manobela/images/manobela-insights.png), and [session details screenshot](https://dejel.me/projects/manobela/images/manobela-session-details.png)."
          - "Impact: Demonstrates how computer vision, mobile development, and cloud services can support safer driving workflows for commuters, delivery drivers, and long-haul drivers."

      - name: "[Project HERMES](https://project-hermes-drrm.vercel.app)"
        highlights:
          - "Problem: Emergency reports often arrive as unstructured messages, making it harder for responders to classify incidents, monitor status, and coordinate action."
          - "Solution: Built a Hazard and Emergency Reporting, Monitoring, and Evaluation System for real-time disaster communication workflows."
          - "System screenshots and concept: [project article](https://dejely.github.io/projects/hermes/index.html), live dashboard concept, report intake flow, role-based access control, and Supabase-backed incident monitoring."
          - "Impact: Shows how emergency-reporting software can convert citizen or chat-based reports into structured operational information for responders and coordinators."

      - name: "[PrivMotion](https://github.com/dejely/privmotion)"
        highlights:
          - "Problem: Motion-analysis workflows often depend on identity-bearing images or video, creating privacy and retention concerns for research and health-oriented settings."
          - "Solution: Built a privacy-preserving motion analytics prototype that converts visual input into skeleton keypoints, silhouettes, depth-like surrogates, and kinematic features."
          - "Privacy and architecture evidence: [project article](https://dejely.github.io/projects/privmotion/index.html), [GitHub repository](https://github.com/dejely/privmotion), anonymized output pipeline, metadata records, optional feature encryption, and audit-oriented design notes."
          - "HIPAA-oriented design: Supports aggregate/de-identification-oriented workflows for qualified review, while clearly separating prototype behavior from formal HIPAA certification."
          - "Use cases: Research motion analysis, privacy-aware video preprocessing, kinematic feature extraction, and safer sharing of derived movement data."

